name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-release-artifacts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: cashtrack-linux-x64
            binary_suffix: ""
          - os: macos-14
            artifact_name: cashtrack-macos-arm64
            binary_suffix: ""
          - os: windows-2022
            artifact_name: cashtrack-win-x64
            binary_suffix: ".exe"
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCASHTRACK_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release -j

      - name: Locate binary (POSIX)
        if: runner.os != 'Windows'
        run: cp build/cashtrack ${{ matrix.artifact_name }}

      - name: Locate binary (Windows)
        if: runner.os == 'Windows'
        run: copy build\Release\cashtrack.exe ${{ matrix.artifact_name }}.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}${{ matrix.binary_suffix }}

  publish:
    needs: build-release-artifacts
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
